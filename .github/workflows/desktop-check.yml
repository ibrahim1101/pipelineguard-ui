name: Desktop shell validation

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/**'
      - 'engine/**'
      - '.github/workflows/desktop-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/**'
      - 'engine/**'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-check:
    name: Tauri Rust check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Validate Tauri manifest and configuration
        shell: pwsh
        run: |
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.bundle.active -ne $false) { throw 'Bundling must remain disabled until packaging is verified' }
          if ($config.build.frontendDist -ne '../../frontend/build') { throw 'Unexpected frontend build path' }
          if (-not (Test-Path desktop/src-tauri/Cargo.toml)) { throw 'Missing Rust manifest' }
          $icon = 'desktop/src-tauri/icons/icon.ico'
          if (-not (Test-Path $icon)) { throw 'Missing approved Cerberus Windows icon' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $icon))
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0 -or $bytes[1] -ne 0 -or $bytes[2] -ne 1 -or $bytes[3] -ne 0) { throw 'Invalid or placeholder Cerberus icon' }
          if (-not (Test-Path frontend/public/cerberus-logo-original.png)) { throw 'Missing high-resolution Cerberus logo' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production frontend for native shell
        working-directory: frontend
        shell: pwsh
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Frontend npm dependency installation failed' }
          $env:CI = 'false'
          npm run build
      - name: Build unbundled Windows desktop executable
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          cargo build --release
          if (-not (Test-Path target/release/pipelineguard-desktop.exe)) { throw 'Missing compiled Cerberus desktop executable' }
      - name: Check Rust shell
        working-directory: desktop/src-tauri
        run: cargo check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native bridge integration dependencies
        run: python -m pip install -r backend/requirements-desktop.txt
      - name: Test Rust shell security, process lifecycle and real bridge readiness
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          $env:CERBERUS_TEST_BACKEND_DIR = (Resolve-Path ../../backend).Path
          $env:CERBERUS_TEST_ENGINE_DIR = (Resolve-Path ../../engine).Path
          $env:CERBERUS_TEST_PYTHON = (Get-Command python).Source
          cargo test
