name: PipelineGuard UI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Build frontend
        env:
          CI: 'false'
          DISABLE_EMERGENT_OVERLAY: 'true'
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
        run: yarn build

  backend-smoke:
    name: Python bridge smoke checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui
      - uses: actions/checkout@v4
        with:
          repository: ibrahim1101/PipelineGuard
          ref: feat/v2-engine-integration
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge and engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.110.1 uvicorn==0.25.0 'pydantic>=2.6.4,<3' python-dotenv httpx 'typer>=0.12' rich pytest
          python -m pip install -e ./engine
      - name: Compile Python bridge
        run: python -m compileall -q ui/backend
      - name: Test local storage and report tracking
        env:
          PYTHONPATH: ${{ github.workspace }}/ui/backend
        run: python -m unittest discover -s ui/backend/tests -p 'test_*.py' -v
      - name: Check bridge startup and authentication
        env:
          PIPELINEGUARD_ENGINE_PATH: ${{ github.workspace }}/engine
          PYTHONPATH: ${{ github.workspace }}/ui/backend
          PIPELINEGUARD_DESKTOP_MODE: '1'
          PIPELINEGUARD_TOKEN: ci-test-token
          CORS_ORIGINS: http://localhost:3000
          PIPELINEGUARD_DATA_DIR: ${{ runner.temp }}/pipelineguard-ci-data
        run: python ui/backend/tests/smoke_bridge.py
      - name: Offline scan and report integration
        env:
          PIPELINEGUARD_ENGINE_PATH: ${{ github.workspace }}/engine
          PYTHONPATH: ${{ github.workspace }}/ui/backend
          PIPELINEGUARD_DESKTOP_MODE: '1'
          PIPELINEGUARD_TOKEN: ci-test-token
          CORS_ORIGINS: http://localhost:3000
          PIPELINEGUARD_DATA_DIR: ${{ runner.temp }}/pipelineguard-ci-data
        run: python ui/backend/tests/integration_scan.py
